<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">CrewAI Executive Research Workflow</title>
  <desc id="desc">A visual showing how CrewAI coordinates specialized agents to turn a research topic and governed sources into an executive-ready report.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3a4a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1400" height="720" fill="#f7f8fb"/>

  <text x="700" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#172033">
    Why CrewAI Fits This Use Case
  </text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5568">
    A broad enterprise research request becomes an inspectable, role-based workflow with governed inputs and executive-ready outputs.
  </text>

  <rect x="70" y="270" width="210" height="120" rx="18" fill="#ffffff" stroke="#c9d2e3" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172033">Research Topic</text>
  <text x="175" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5568">finance - procure-to-pay</text>

  <rect x="330" y="165" width="740" height="330" rx="24" fill="#eef4ff" stroke="#9eb7e5" stroke-width="2"/>
  <text x="700" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172033">CrewAI Research Crew</text>
  <text x="700" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5568">Agents, tasks, and orchestration make the workflow explicit and inspectable.</text>

  <rect x="370" y="280" width="150" height="120" rx="16" fill="#ffffff" stroke="#b8c6dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="445" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Research</text>
  <text x="445" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Planner</text>
  <text x="445" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5568">Scopes the</text>
  <text x="445" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5568">question</text>

  <rect x="555" y="280" width="150" height="120" rx="16" fill="#ffffff" stroke="#b8c6dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Industry</text>
  <text x="630" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Researcher</text>
  <text x="630" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5568">Market context</text>
  <text x="630" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5568">+ buyer pain</text>

  <rect x="740" y="280" width="150" height="120" rx="16" fill="#ffffff" stroke="#b8c6dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Startup /</text>
  <text x="815" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Vendor</text>
  <text x="815" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Researcher</text>
  <text x="815" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5568">Entrants + signals</text>

  <rect x="925" y="280" width="150" height="120" rx="16" fill="#ffffff" stroke="#b8c6dc" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Executive</text>
  <text x="1000" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">Synthesizer</text>
  <text x="1000" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5568">Briefing +</text>
  <text x="1000" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b5568">recommendations</text>

  <rect x="1115" y="270" width="230" height="120" rx="18" fill="#ffffff" stroke="#c9d2e3" stroke-width="2" filter="url(#shadow)"/>
  <text x="1230" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#172033">Executive Report</text>
  <text x="1230" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5568">HTML + Markdown</text>
  <text x="1230" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5568">sources included</text>

  <rect x="385" y="555" width="280" height="90" rx="16" fill="#ffffff" stroke="#c9d2e3" stroke-width="2" filter="url(#shadow)"/>
  <text x="525" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#172033">Data Sources</text>
  <text x="525" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5568">web, filings, CRM, internal KBs</text>

  <rect x="735" y="555" width="300" height="90" rx="16" fill="#ffffff" stroke="#c9d2e3" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#172033">Enterprise Controls</text>
  <text x="885" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5568">scoring, citations, recency, review</text>

  <line x1="280" y1="330" x2="360" y2="340" stroke="#2f3a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="520" y1="340" x2="545" y2="340" stroke="#2f3a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="705" y1="340" x2="730" y2="340" stroke="#2f3a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="890" y1="340" x2="915" y2="340" stroke="#2f3a4a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1075" y1="340" x2="1105" y2="330" stroke="#2f3a4a" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="525" y1="555" x2="630" y2="410" stroke="#2f3a4a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <line x1="525" y1="555" x2="815" y2="410" stroke="#2f3a4a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <line x1="885" y1="555" x2="1135" y2="390" stroke="#2f3a4a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <text x="700" y="685" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4b5568">
    Key message: CrewAI turns a broad request into a governed, inspectable, role-based research workflow.
  </text>
</svg>
